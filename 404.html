<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#ff7a45" />
  <title>Página não encontrada | Rancho Pirabas</title>
  <style>
    :root {
      color-scheme: light;
      --cream: #fffaf0;
      --sand: #f7ecd9;
      --indigo: #2b2140;
      --amber: #ff7a45;
      --magenta: #c4467a;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 2rem;
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 122, 69, 0.22), transparent 32%),
        radial-gradient(circle at 88% 80%, rgba(196, 70, 122, 0.18), transparent 34%),
        linear-gradient(145deg, var(--cream), var(--sand));
      color: var(--indigo);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 42rem);
      padding: clamp(2rem, 7vw, 4.5rem) clamp(1.4rem, 6vw, 4rem);
      border: 1px solid rgba(43, 33, 64, 0.12);
      border-radius: 2rem;
      background: rgba(255, 250, 240, 0.72);
      box-shadow: 0 1.5rem 4rem rgba(43, 33, 64, 0.14);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 0.8rem;
      color: var(--magenta);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--indigo);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(4.5rem, 18vw, 9rem);
      line-height: 0.9;
      letter-spacing: -0.08em;
    }

    h2 {
      margin: 1.4rem 0 0.75rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.6rem, 4vw, 2.35rem);
      line-height: 1.1;
    }

    p {
      max-width: 31rem;
      margin: 0 auto;
      color: rgba(43, 33, 64, 0.78);
      font-size: 1rem;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      margin-top: 1.8rem;
      padding: 0.8rem 1.25rem;
      border-radius: 999px;
      background: var(--indigo);
      color: var(--cream);
      font-weight: 800;
      text-decoration: none;
      transition: transform 180ms ease, background-color 180ms ease;
    }

    a:hover,
    a:focus-visible {
      background: var(--magenta);
      transform: translateY(-2px);
    }

    a:focus-visible {
      outline: 3px solid rgba(255, 122, 69, 0.5);
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      a { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Rancho Pirabas</p>
    <h1>404</h1>
    <h2>Essa página saiu para ver o pôr do sol.</h2>
    <p>O endereço que você acessou não existe ou mudou de lugar. Volte para a página inicial e continue sua experiência à beira-mar.</p>
    <a href="./">Voltar ao Rancho</a>
  </main>
</body>
</html>
